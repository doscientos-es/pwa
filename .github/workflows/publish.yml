name: Publish new package version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-pwa
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
      - id: version
        name: Preserve manual versions or bump patch
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          previous_version=""
          if git cat-file -e "${{ github.event.before }}:package.json" 2>/dev/null; then
            previous_version="$(git show "${{ github.event.before }}:package.json" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")"
          fi
          if [ -n "$previous_version" ] && [ "$version" = "$previous_version" ]; then
            npm version patch --no-git-tag-version --ignore-scripts
            version="$(node -p "require('./package.json').version")"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm run check
      - run: npm pack --dry-run
      - name: Confirm main has not advanced
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during validation; refusing to publish an obsolete version."
            exit 1
          fi
      - name: Verify release version and tag are available
        id: release
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.value }}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Version $version already exists on npm."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit automatic patch bump and tag release
        if: steps.release.outputs.tagged == 'false'
        env:
          BUMPED: ${{ steps.version.outputs.bumped }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMPED" = "true" ]; then
            git add package.json
            git commit -m "chore(release): v$VERSION [skip ci]"
          fi
          git tag --annotate "v$VERSION" --message "v$VERSION"
          git push origin HEAD:main --follow-tags
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@^11.5.1 --ignore-scripts
      - name: Publish with provenance
        run: npm publish --provenance
